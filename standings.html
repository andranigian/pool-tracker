<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standings — Pool Tracker</title>
<meta name="description" content="Live leaderboard for the weekly confidence pool — everyone's picks, scored automatically as games finish.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#0f1115; color:#e6e8eb; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
  header.top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom: 18px; }
  header.top h1 { font-size:1.2rem; margin:0; }
  header.top a { color:#9cc0ff; font-size:.82rem; text-decoration:none; }
  header.top a:hover { text-decoration:underline; }
  .week-picker-row { margin-bottom: 10px; display:flex; align-items:center; gap:8px; font-size:.85rem; color:#9aa1ac; }
  .week-picker-row select { background:#1a1d24; border:1px solid #333844; color:#e6e8eb; border-radius:6px; padding:6px 8px; font-size:.85rem; }
  .sort-toggle-row { margin-bottom: 10px; display:flex; align-items:center; gap:8px; font-size:.85rem; color:#9aa1ac; }
  .sort-btn { background:#1a1d24; border:1px solid #333844; color:#9cc0ff; border-radius:6px; padding:6px 10px; font-size:.85rem; cursor:pointer; }
  .sort-btn.active { background:#1a2f52; border-color:#3a6bd8; color:#e6e8eb; font-weight:600; }
  .status { margin: 10px 0; padding:10px 12px; border-radius:6px; font-size:.85rem; line-height:1.4; }
  .status.error { background:#3a1a1a; color:#ff9b9b; }
  .status.ok { background:#123321; color:#8ee6ab; }
  .status.info { background:#1a2233; color:#9cc0ff; }
  table.board { width:100%; border-collapse:collapse; margin-top:10px; font-size:.88rem; }
  table.board th, table.board td { border:1px solid #2a2e37; padding:8px 10px; text-align:left; }
  table.board th { color:#9aa1ac; font-weight:600; background:#151821; }
  table.board tr.me { background:#152040; }
  .rank { color:#9aa1ac; width:36px; }
  .pending-tag { color:#e0b34d; font-size:.75rem; }
  details.week-picks summary { cursor:pointer; color:#9cc0ff; font-size:.8rem; }
  table.week { width:100%; border-collapse:collapse; margin:8px 0 4px; font-size:.8rem; }
  table.week th, table.week td { border:1px solid #2a2e37; padding:5px 7px; text-align:left; }
  .result-win { color:#8ee6ab; }
  .result-loss { color:#ff9b9b; }
  .result-pending { color:#9aa1ac; }
  footer { text-align:center; color:#6b7280; font-size:.75rem; margin-top:30px; }
  footer a { color:#9cc0ff; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🎯 Pool Tracker — Standings</h1>
    <a href="/">Make your picks →</a>
  </header>

  <div class="week-picker-row">
    <label for="weekPicker">Week:</label>
    <select id="weekPicker"><option value="">Loading…</option></select>
  </div>

  <div class="sort-toggle-row">
    <span>Rank by:</span>
    <button type="button" class="sort-btn" data-mode="alltime">Season</button>
    <button type="button" class="sort-btn" data-mode="week">Week Live</button>
  </div>

  <div id="weekLabel" class="status info">Loading…</div>
  <div id="boardWrap"></div>

  <footer>
    Scores refresh automatically from ESPN as games finish. Admin: <a href="/admin-pool">admin-pool →</a> · Sheet standings: <a href="/sheet-standings">sheet-standings →</a>
  </footer>
</div>

<script>
const API = "/api";
let sortMode = "alltime"; // "alltime" | "week" -- which total ranks the table
let lastData = null; // last successfully loaded /api/standings payload, so toggling sort doesn't need a refetch

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function normTeam(s) {
  // Hyphens treated as spaces too -- "Louisiana-Monroe" (as typed on the
  // pool sheet) needs to match ESPN's "Louisiana Monroe" (no hyphen), and
  // there's no reason a hyphenated team name should ever need to match
  // literally rather than just word-for-word.
  let t = String(s || "").replace(/[.'’]/g, "").replace(/[-\s]+/g, " ").trim().toUpperCase();
  // "L.A." collapses to "LA" above, but ESPN's own team fields always
  // spell it out as "Los Angeles" (both LA teams) -- expand the leading
  // token so a pick entered as "L.A. Chargers"/"L.A. Rams" still matches.
  t = t.replace(/^LA\b/, "LOS ANGELES");
  return t;
}
const TEAM_ALIASES = {
  "MISSISSIPPI": "OLE MISS", // ESPN calls Ole Miss by location "Ole Miss", not "Mississippi"
  "LOUISIANA MONROE": "UL MONROE", // ESPN calls them "UL Monroe", not "Louisiana Monroe"
  "CENTRAL FLORIDA": "UCF" // ESPN calls them "UCF" in every team field, never spells out the city name
};
function lookupTeam(index, name) {
  const key = normTeam(name);
  return index.get(key) || (TEAM_ALIASES[key] && index.get(TEAM_ALIASES[key]));
}

async function refreshScoresFromESPN(week, games) {
  try {
    // A final game with a score already never needs refetching; a final
    // game WITHOUT one yet (finished before fav_score/dog_score existed)
    // still needs one round trip so its score can display.
    const pending = games.filter(g => g.status !== "cancelled" && (g.status !== "final" || g.fav_score == null || g.dog_score == null));
    if (!pending.length) return false;

    // Centered on the week's own deadline, not "now" -- so refreshing an
    // old week (to backfill a score) still lands ESPN's date window on the
    // games that were actually played that week.
    const center = week && week.deadline ? new Date(week.deadline) : new Date();
    const start = new Date(center); start.setUTCDate(start.getUTCDate() - 5);
    const end = new Date(center); end.setUTCDate(end.getUTCDate() + 4);
    const fmt = d => d.toISOString().slice(0, 10).replace(/-/g, "");
    const dateRange = fmt(start) + "-" + fmt(end);

    const espnResults = await Promise.all([
      fetch("https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?dates=" + dateRange + "&limit=300"),
      fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=" + dateRange + "&limit=100")
    ]);
    // Kept as SEPARATE per-sport indices rather than one merged map --
    // "Pittsburgh", "Washington", "Tennessee", "Minnesota", "Arizona",
    // "Buffalo" etc. each name BOTH an NFL team and a college team, so
    // merging both sports into one map means whichever sport got indexed
    // last always wins that key -- silently resolving a college pick
    // (e.g. "PITTSBURGH" vs "Central Florida") to the NFL team of the
    // same name instead, which then never shares a competition with its
    // real opponent and stays unmatched forever, even once that college
    // game is long final.
    const indexes = [];
    for (const res of espnResults) {
      if (!res.ok) continue;
      const data = await res.json();
      const events = data.events || [];
      if (!events.length) continue;
      const index = new Map();
      for (const ev of events) {
        const comp = ev.competitions && ev.competitions[0];
        if (!comp) continue;
        for (const c of comp.competitors || []) {
          const t = c.team || {};
          // t.displayName is the full "City Mascot" ESPN name (e.g. "Los
          // Angeles Rams", "New York Giants") -- picks stored with the
          // full team name (rather than just the city or just the
          // mascot) only ever match against this field, so it has to be
          // indexed too.
          for (const variant of [t.location, t.shortDisplayName, t.abbreviation, t.name, t.displayName]) {
            if (variant) index.set(normTeam(variant), { competition: comp, competitor: c });
          }
        }
      }
      indexes.push(index);
    }
    if (!indexes.length) return false;

    const updates = [];
    for (const g of pending) {
      // Try each sport's index on its own -- requiring both sides to
      // resolve within the SAME sport's index (and the SAME competition
      // there) is what keeps a college matchup from ever being satisfied
      // by a stray NFL team of the same city/state name, and vice versa.
      let match = null;
      for (const index of indexes) {
        const fav = lookupTeam(index, g.favorite);
        const dog = lookupTeam(index, g.underdog);
        if (fav && dog && fav.competition === dog.competition) { match = { fav, dog }; break; }
      }
      if (!match) continue;
      const statusType = match.fav.competition.status.type;
      updates.push({
        gameId: g.id,
        favScore: parseFloat(match.fav.competitor.score) || 0,
        dogScore: parseFloat(match.dog.competitor.score) || 0,
        completed: !!statusType.completed,
        inProgress: statusType.state === "in"
      });
    }
    if (!updates.length) return false;

    await fetch(API + "/refresh", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ updates })
    });
    return true;
  } catch (e) {
    console.warn("refreshScoresFromESPN:", e.message);
    return false;
  }
}

function renderBoard(data) {
  lastData = data; // cached so the sort-mode toggle can re-render without refetching
  const labelEl = document.getElementById("weekLabel");
  const wrap = document.getElementById("boardWrap");
  updateSortButtons(data.week);
  if (!data.week) {
    labelEl.className = "status info";
    labelEl.textContent = "No pool week is open right now.";
    wrap.innerHTML = "";
    return;
  }
  labelEl.className = "status ok";
  labelEl.textContent = "Week " + data.week.weekNumber + " (" + (data.week.label || "") + ") — deadline " + new Date(data.week.deadline).toLocaleString();

  if (!data.standings.length) {
    wrap.innerHTML = '<div class="status info">No picks yet for this week — be the first at <a href="/" style="color:#9cc0ff">the picks page</a>.</div>';
    return;
  }

  // "Season" ranks by seasonTotal (the server's own default rank, kept
  // as a tiebreaker below). "Week Live" ranks by this week's own total
  // instead, so who's actually leading the week in progress doesn't
  // require scanning the whole season-long list for it.
  const sorted = [...data.standings].sort((a, b) => {
    if (sortMode === "week") return b.weekTotal - a.weekTotal || b.seasonTotal - a.seasonTotal || a.displayName.localeCompare(b.displayName);
    return b.seasonTotal - a.seasonTotal || b.weekTotal - a.weekTotal || a.displayName.localeCompare(b.displayName);
  });
  sorted.forEach((s, i) => { s.displayRank = i + 1; });

  let html = '<table class="board"><thead><tr><th class="rank">#</th><th>Name</th><th>Season</th><th>This week</th><th></th></tr></thead><tbody>';
  sorted.forEach(s => {
    html += `<tr>
      <td class="rank">${s.displayRank}</td>
      <td>${esc(s.displayName)}</td>
      <td>${s.seasonTotal}${s.seasonPending ? ' <span class="pending-tag">(live)</span>' : ""}</td>
      <td>${s.weekTotal}${s.weekPending ? ' <span class="pending-tag">(live)</span>' : ""}</td>
      <td>${s.weekPicks.length ? '<details class="week-picks"><summary>picks</summary>' + weekPicksTable(s.weekPicks) + '</details>' : ""}</td>
    </tr>`;
  });
  html += "</tbody></table>";
  wrap.innerHTML = html;
}

function updateSortButtons(week) {
  const weekBtn = document.querySelector('.sort-btn[data-mode="week"]');
  const allBtn = document.querySelector('.sort-btn[data-mode="alltime"]');
  if (weekBtn) weekBtn.textContent = week ? "Week " + week.weekNumber + " Live" : "Week Live";
  if (allBtn) allBtn.classList.toggle("active", sortMode === "alltime");
  if (weekBtn) weekBtn.classList.toggle("active", sortMode === "week");
}

document.querySelectorAll(".sort-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    sortMode = btn.dataset.mode;
    if (lastData) renderBoard(lastData);
  });
});

function weekPicksTable(picks) {
  const sorted = [...picks].sort((a, b) => b.points - a.points);
  let html = '<table class="week"><thead><tr><th>Pts</th><th>Pick</th><th>Line</th><th>Score</th><th>Result</th></tr></thead><tbody>';
  sorted.forEach(p => {
    // market='total': favorite/underdog hold the real underlying game's
    // teams (for ESPN lookup), not "Over"/"Under" -- so the pick label and
    // line shown here are derived from the market instead, same idea as
    // index.html's sideLabels().
    const isTotal = p.market === "total";
    // favorite/underdog hold the real teams even for a total pick -- fold
    // them into the label so it's clear which game the total belongs to.
    const pickName = isTotal
      ? (p.side === "favorite" ? "Over " + (p.spread + 1) : "Under " + (p.spread - 1)) + " (" + p.favorite + "/" + p.underdog + ")"
      // Show the opponent too -- "Los Angeles Rams" alone doesn't say who
      // they're playing; favorite/underdog are always both on the row.
      : (p.side === "favorite" ? p.favorite + " (vs " + p.underdog + ")" : p.underdog + " (vs " + p.favorite + ")");
    // A favorite is MINUS the spread, not plus -- this used to always show
    // "+N" regardless of side, which is only correct for the underdog.
    const lineText = isTotal ? "O/U " + (p.spread - 1) + "/" + (p.spread + 1)
      : (p.side === "favorite" ? "-" : "+") + p.spread;
    const resultText = p.result === "pending" ? "pending" : (p.result === "win" ? "won (+" + p.earned + ")" : "lost");
    // Always favorite-then-underdog, regardless of which side was picked --
    // same fixed order the Favorite/Underdog columns use everywhere else.
    const scoreText = p.favScore != null && p.dogScore != null ? p.favScore + "–" + p.dogScore : "—";
    html += `<tr><td>${p.points}</td><td>${esc(pickName)}</td><td>${lineText}</td><td>${scoreText}</td><td class="result-${p.result}">${resultText}</td></tr>`;
  });
  html += "</tbody></table>";
  return html;
}

async function loadStandings(weekId) {
  try {
    const res = await fetch(API + "/standings" + (weekId ? "?weekId=" + encodeURIComponent(weekId) : ""));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    renderBoard(data);
    return data;
  } catch (e) {
    document.getElementById("weekLabel").className = "status error";
    document.getElementById("weekLabel").textContent = "Couldn't load standings: " + e.message;
  }
}

// Populates the "Week:" dropdown from every week ever saved, and keeps it
// in sync with whichever week is actually on screen (including the one
// the server picked by default, on first load, before any option here
// was explicitly chosen).
let allWeeks = [];
async function loadWeekPicker(selectedId) {
  const sel = document.getElementById("weekPicker");
  try {
    if (!allWeeks.length) {
      const res = await fetch(API + "/weeks");
      const data = await res.json();
      allWeeks = data.weeks || [];
    }
    sel.innerHTML = allWeeks.map(w =>
      `<option value="${w.id}">Week ${w.week_number}${w.label ? " (" + w.label + ")" : ""}</option>`
    ).join("");
  } catch (e) {
    sel.innerHTML = '<option value="">(couldn\'t load week list)</option>';
  }
  if (selectedId) sel.value = selectedId;
}

// One page load (or one dropdown switch) = load that week's standings,
// sync the picker and the URL to match, then run the usual ESPN refresh
// against that week's own games.
async function showWeek(weekId, opts) {
  const pushState = opts && opts.pushState;
  const data = await loadStandings(weekId);
  if (!data || !data.week) return;
  await loadWeekPicker(data.week.id);
  const url = new URL(location.href);
  if (data.week.id) url.searchParams.set("weekId", data.week.id); else url.searchParams.delete("weekId");
  if (pushState) history.pushState(null, "", url); else history.replaceState(null, "", url);

  const weekRes = await fetch(API + "/week?id=" + encodeURIComponent(data.week.id));
  const weekData = await weekRes.json();
  const changed = await refreshScoresFromESPN(data.week, weekData.games || []);
  if (changed) loadStandings(data.week.id);
}

document.getElementById("weekPicker").addEventListener("change", e => {
  showWeek(e.target.value, { pushState: true });
});

showWeek(new URLSearchParams(location.search).get("weekId") || undefined);

// There's no server-side push -- refreshScoresFromESPN only ever runs when
// showWeek does, and until now that was only on initial load or a manual
// week-picker change. On game day that meant scores froze at whatever they
// were the moment the tab was opened. Poll on a timer too, reusing whatever
// weekId the picker is currently showing (replaceState only, so this never
// spams browser history).
setInterval(() => {
  const wp = document.getElementById("weekPicker");
  if (wp && wp.value) showWeek(wp.value);
}, 30000);
</script>
</body>
</html>
